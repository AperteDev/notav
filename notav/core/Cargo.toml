[package]
name = "notav-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Markdown for Editor mode; without its HTML writer.
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
quick-xml = "0.42.0"
# 0.38 is what Fedora packages; the system SQLite, as distributions want.
rusqlite = ">=0.38, <0.41"
ureq = "3.4.2"

# The system's certificate authorities (net.rs); Android's come from the app.
[target.'cfg(not(target_os = "android"))'.dependencies]
ureq = { version = "3.4.2", features = ["platform-verifier"] }

[features]
integration = []
