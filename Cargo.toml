[workspace]
resolver = "3"
members = ["notav/core", "notav/cli", "notav/linux/app"]
# The bindings' own workspace: see notav/Cargo.toml.
exclude = ["notav/ffi"]

# One version for the whole app, set by the Release workflow (scripts/release.py).
[workspace.package]
version = "0.6.0"
edition = "2024"
license = "GPL-3.0-or-later"
