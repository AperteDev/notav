org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true

# What the build needs from the SDK, in one place: the build scripts use them and sdk.sh installs
# exactly these, so Gradle never downloads copies of its own into the shared SDK. The same as
# Todav's (todav/android/gradle.properties): one SDK and emulator for both.
notav.platform=android-37.0
notav.buildTools=37.0.0
notav.ndk=30.0.16248370
notav.minSdk=29
# The emulator's image, for developing apps: stock Android 17 with Google Play (see sdk.sh).
notav.image=system-images;android-37.0;google_apis_playstore;x86_64

# The ABIs the core is built for; `make run` builds only the emulator's (x86_64).
notav.abis=arm64-v8a,x86_64

# The release's version code (1.2.3 is 10203), set by scripts/release.py; F-Droid reads it here.
notav.versionCode=501
# The cargo-ndk CI and F-Droid build releases with, so their builds match (with the NDK above and
# the Rust in notav/ffi/rust-toolchain.toml).
notav.cargoNdk=4.1.2
