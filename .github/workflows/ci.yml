name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-24.04
    # GNOME 51's GTK and libadwaita, which the app builds against.
    container: fedora:45
    steps:
      - name: Install the build dependencies
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          git gcc gtk4-devel libadwaita-devel libsecret-devel glib2-devel blueprint-compiler
          gettext
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Unit tests; the integration tests need a Nextcloud account.
      - run: cargo test --workspace --locked
