# The bindings' workspace (ffi), apart from the repository's. Rooted here rather than in ffi so
# notav-core lies inside it: Cargo hashes the path of a path dependency outside the workspace
# into its symbols, which would make the Android library differ wherever it is built (F-Droid
# rebuilds releases to compare). The rest belongs to the repository's workspace.
[workspace]
resolver = "3"
members = ["ffi"]
exclude = ["cli", "core", "linux"]
